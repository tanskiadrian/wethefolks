<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Gut Run</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ad">
    <div id="world">
      <img class="layer" src="assets/bg.jpg" alt="">
      <img class="layer" src="assets/game/bg_texture.png" alt="">
      <canvas id="game" width="720" height="1280"></canvas>
      <img class="layer" src="assets/border.png" alt="">
    </div>

    <img class="layer" src="assets/logo.png" alt="">

    <div id="start">
      <img class="layer" id="headline" src="assets/game/tut.png" alt="Bringe Poo durch den Darm ans Ziel.">
      <img id="gesture" src="assets/gesture.png" alt="tap to run">
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
