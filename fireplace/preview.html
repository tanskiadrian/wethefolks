<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Fireplace preview</title>
  <style>
    body {
      margin: 0;
      background: #2a2a2a;
      font-family: sans-serif;
      overflow-x: hidden;
    }

    #page {
      position: relative;
      width: 1680px;
      height: 975px;
      margin: 0 auto;
      transform-origin: 50% 0;
    }

    iframe {
      position: absolute;
      top: 0;
      border: 0;
    }

    #site {
      position: absolute;
      left: 324px;
      top: 254px;
      width: 1032px;
      height: 721px;
      background: #f3f3f0;
      color: #999;
      padding: 30px;
      box-sizing: border-box;
    }

    #site div {
      height: 14px;
      background: #e2e2de;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <div id="page">
    <iframe src="left.html" width="320" height="975" style="left: 0"></iframe>
    <iframe src="top.html" width="1032" height="250" style="left: 324px"></iframe>
    <iframe src="right.html" width="320" height="975" style="left: 1360px"></iframe>
    <div id="site">
      <p>Website</p>
      <br>
      <div style="width: 60%"></div>
      <div></div>
      <div></div>
      <div style="width: 80%"></div>
    </div>
  </div>

  <script>
    const page = document.getElementById('page');
    const frames = document.querySelectorAll('iframe');

    function fit() {
      const s = Math.min(1, window.innerWidth / 1680);
      page.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();

    if (location.search) {
      frames.forEach((f) => {
        f.src = f.getAttribute('src') + location.search;
      });
    }

    let loaded = 0;
    frames.forEach((f) => {
      f.addEventListener('load', () => {
        loaded++;
        if (loaded === frames.length) {
          frames.forEach((f) => f.contentWindow.postMessage('start', '*'));
        }
      });
    });
  </script>
</body>
</html>
